<!DOCTYPE html>
<html>
<head>
  <meta charset=”UTF-8”>
  <title>Квадратное уравнение</title>
  <script>
    function solve() {
      let a = parseFloat(document.getElementById("a").value);
      let b = parseFloat(document.getElementById("b").value);
      let c = parseFloat(document.getElementById("c").value);
      let d = b*b - 4*a*c;
      let out = "";
      if (a === 0) out = 'Не квадратное уравнение (a=0)';
      else if (d < 0) out = 'Нет действительных корней';
      else if (d === 0) out = 'x = ' + (-b/(2*a));
      else {
        let x1 = (-b + Math.sqrt(d))/(2*a);
        let x2 = (-b - Math.sqrt(d))/(2*a);
        out = 'x1 = ' + x1 + ', x2 = ' + x2;
      }
      document.getElementById('result').innerHTML = out;
    }
  </script>
</head>
<body>
  <h3>Решение ax² + bx + c = 0</h3>
  A: <input id="a"><br>
  B: <input id="b"><br>
  C: <input id="c"><br>
  <button onclick="solve()">Решить</button>
  <p id="result"></p>

  <h4>Тестирование</h4>
  <ul>
    <li>Тест 1: a=1, b=-3, c=2 → корни 1 и 2 (OK)</li>
    <li>Тест 2: a=1, b=2, c=1 → x = -1 (OK)</li>
    <li>Тест 3: a=1, b=0, c=4 → нет корней (OK)</li>
  </ul>
</body>
</html>
